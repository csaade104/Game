<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>EMBERHOLD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0608;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
    }

    #game-container {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0a0608;
    }

    /* DO NOT set width/height on canvas — Phaser owns those */
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Safe area CSS variables — consumed by Phaser game code */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    #loading-text {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ff6b35; font-family: monospace;
      font-size: 16px; letter-spacing: 4px;
      text-transform: uppercase;
      animation: pulse 1.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

    #rotate-hint {
      display: none; position: fixed;
      top: 0; left: 0; right: 0;
      background: #1a0a08ee; color: #ff6b35;
      font-family: monospace; font-size: 11px;
      letter-spacing: 2px; text-align: center;
      padding: 6px; z-index: 9999; pointer-events: none;
    }
    @media (orientation: portrait) { #rotate-hint { display: block; } }
  </style>
</head>
<body>
  <div id="rotate-hint">↻ ROTATE FOR BEST EXPERIENCE</div>
  <div id="game-container">
    <div id="loading-text">Kindling the ember...</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const lockLandscape = () => {
      if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{});
    };
    if (!isIOS) {
      const fs = () => {
        const el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen({navigationUI:'hide'}).then(lockLandscape).catch(()=>{});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
          setTimeout(lockLandscape, 200);
        }
      };
      document.addEventListener('touchstart', fs, {once:true});
      document.addEventListener('click', fs, {once:true});
    } else {
      // iOS: try immediately (won't lock, but attempt orientation via ScreenOrientation API if available)
      lockLandscape();
    }
  </script>
</body>
</html>
