<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>EMBERHOLD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      height: 100%;
      height: -webkit-fill-available;
    }

    body {
      width: 100%;
      min-height: 100%;
      min-height: -webkit-fill-available;
      background: #0a0608;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      /* fill behind notch/island on iPhone */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    #game-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0608;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* fill the container completely */
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }

    #loading-text {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ff6b35; font-family: monospace;
      font-size: 16px; letter-spacing: 4px;
      text-transform: uppercase;
      animation: pulse 1.5s ease-in-out infinite;
      white-space: nowrap;
      pointer-events: none;
    }
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

    /* Portrait hint — just a small banner, doesn't block the game */
    #rotate-hint {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #1a0a08ee;
      color: #ff6b35;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-align: center;
      padding: 6px;
      z-index: 9999;
      pointer-events: none;
    }
    @media (orientation: portrait) {
      #rotate-hint { display: block; }
    }
  </style>
</head>
<body>
  <div id="rotate-hint">↻ ROTATE DEVICE FOR BEST EXPERIENCE</div>

  <div id="game-container">
    <div id="loading-text">Kindling the ember...</div>
  </div>

  <script type="module" src="/src/main.ts"></script>

  <script>
    // Lock to landscape where supported (Android Chrome)
    if (screen.orientation?.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }

    // Request fullscreen on first touch — hides browser chrome on Android
    // iOS Safari doesn't support fullscreen for web pages, so we skip it there
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (!isIOS) {
      const requestFS = () => {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      };
      document.addEventListener('touchstart', requestFS, { once: true });
      document.addEventListener('click', requestFS, { once: true });
    }
  </script>
</body>
</html>
